
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker_image/airflow/Dockerfile
  env_file: .env
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME}
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
  volumes:
    - ./dags:/opt/airflow/dags
  networks:
    - lakehouse_net
  depends_on:
    postgres:
      condition: service_healthy

services:
  # 1. PostgreSQL: Metadata Backend
  postgres:
    image: postgres:15-alpine
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lakehouse_net
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      retries: 5
      start_period: 10s

  # 2. MinIO: Object Storage (S3-compatible)
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    env_file: .env
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - lakehouse_net
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Web UI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5

  # MinIO Setup (Tự động tạo bucket warehouse)
  minio-setup:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - lakehouse_net
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; 
      mc mb myminio/warehouse --ignore-existing;
      mc policy set public myminio/warehouse;
      "

  # 3. Lakekeeper: Iceberg REST Catalog
  lakekeeper:
    image: quay.io/lakekeeper/catalog:latest
    command: serve
    env_file: .env
    environment:
      # Cấu hình dựa trên chuẩn REST Catalog trỏ tới Postgres
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${LAKEKEEPER_DB_NAME}
      - LAKEKEEPER__PG_ENCRYPTION_KEY=SuperSecretLakekeeperKey123
      - LAKEKEEPER__STORAGE__S3__ENDPOINT=http://minio:9000
      - LAKEKEEPER__STORAGE__S3__ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - LAKEKEEPER__STORAGE__S3__SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - LAKEKEEPER__STORAGE__S3__REGION=${AWS_REGION}
    ports:
      - "${LAKEKEEPER_PORT}:8181"
    networks:
      - lakehouse_net
    depends_on:
      postgres:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully

  # 4. Airflow Init: Cấu hình DB lần đầu
  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME}
      - _AIRFLOW_DB_UPGRADE=True
      - _AIRFLOW_WWW_USER_CREATE=True

  # 5. Airflow Webserver
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # 6. Airflow Scheduler
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

networks:
  lakehouse_net:
    driver: bridge

volumes:
  pg_data:
  minio_data: