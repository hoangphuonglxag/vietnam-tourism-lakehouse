
name: 'tourism_dbt'
version: '1.0.0'
config-version: 2

profile: 'tourism_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  bronze_root: 's3://lakehouse/bronze'

  # Kiểm tra coverage Bronze -> Silver
  # Tỷ lệ tối thiểu số khóa nghiệp vụ hợp lệ ở Bronze phải xuất hiện ở Silver.
  min_bronze_to_silver_ratio: 0.95

  review_coverage_start_month: '2026-01-01'
  review_coverage_end_month: '2026-09-01'

  # Temporal Coverage Metadata
  # Ngày mốc để đánh giá "recent". null => lấy ngày crawl lớn nhất trong dữ liệu.
  coverage_as_of_date: null
  # Số ngày tính từ as_of_date để coi là có dữ liệu gần đây.
  coverage_recent_window_days: 90
  # Độ dài lịch sử tối thiểu (tháng, từ hoạt động đầu tiên đến cuối cùng).
  coverage_min_history_months: 12
  # Số tháng có hoạt động (distinct month) tối thiểu để đủ temporal history.
  coverage_min_active_months: 6
  # Place có số tháng hoạt động <= ngưỡng này bị coi là sparse.
  coverage_sparse_max_active_months: 2
  # Số snapshot rating tối thiểu để coi là có lịch sử rating.
  coverage_min_rating_snapshots: 2

  # ---------------------------------------------------------------------------
  # GOLD LAYER — ngưỡng phân loại xu hướng (có thể override bằng --vars)
  # ---------------------------------------------------------------------------
  # Mức thay đổi google_rating (first -> latest) để coi là improving / declining.
  gold_rating_trend_threshold: 0.05
  # % tăng view (like-for-like trên các video có >= 2 snapshot) để coi là surging / growing.
  gold_views_surging_pct: 20
  gold_views_growing_pct: 5
  # % tăng google_review_count (first -> latest) để coi là đang tăng trưởng.
  gold_review_count_growth_pct: 5
  # Động lượng review 90 ngày gần nhất so với 90 ngày trước đó (%).
  gold_review_momentum_growth_pct: 20
  gold_review_momentum_decline_pct: -30
  # Số review tối thiểu trong cửa sổ 90 ngày để động lượng có ý nghĩa thống kê.
  gold_review_momentum_min_reviews: 5
  # popularity_score (0-100) tối thiểu để coi là địa điểm quy mô lớn.
  gold_large_scale_min_score: 70
  # Tháng bắt đầu tối thiểu của chuỗi thời gian tháng (tránh spine quá dài do video rất cũ).
  gold_monthly_spine_start: '2015-01-01'


models:
  tourism_dbt:
    +materialized: table

    staging:
      +materialized: view
      +tags: ['staging', 'bronze_to_silver']

    silver_layer:
      +materialized: table
      +tags: ['silver']

    gold_layer:
      +materialized: table
      +tags: ['gold']
