tourism_dbt:
  target: dev

  outputs:
    dev:
      type: duckdb
      path: /tmp/tourism_lakehouse.duckdb
      schema: main

      threads: 1

      extensions:
        - httpfs

      settings:
        s3_endpoint: "{{ env_var('DUCKDB_S3_ENDPOINT', 'localhost:9000') }}"
        s3_access_key_id: "{{ env_var('MINIO_ROOT_USER', 'lakehouse_admin') }}"
        s3_secret_access_key: "{{ env_var('MINIO_ROOT_PASSWORD', 'minIO123') }}"
        s3_use_ssl: false
        s3_url_style: path
        s3_region: "{{ env_var('AWS_REGION', 'us-east-1') }}"